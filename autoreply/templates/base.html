<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{{ brand }} автоответы{% endblock %}</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2b2a33;--mute:#7a7684;--line:#e9e3da;--accent:#7b6cc4;--ok:#2e8b57;--warn:#c27c0e;--err:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#18171d;--card:#22212a;--ink:#ecebf2;--mute:#a19dad;--line:#34323d;--accent:#a99bf0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
header b{margin-right:auto}a{color:var(--accent)}main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
h1,h2,h3{margin:.2em 0 .6em}h2{font-size:18px}.mute{color:var(--mute)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{font-size:26px;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl{overflow-x:auto}.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:90px}label{display:block;margin:10px 0 4px;font-weight:600}.check{font-weight:400;display:flex;gap:8px;align-items:center}
button,.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}button.danger{background:var(--err)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.flash{background:#fff4d6;color:#5a4300;padding:10px 14px;border-radius:10px;margin-bottom:12px}
.small{font-size:13px}.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.media label{font-weight:400;margin:0;font-size:12px}
.media img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;display:block}
</style></head><body>
{% if session.auth %}<header><b>🌙 {{ brand }} · автоответы</b><a href="{{ url_for('dashboard') }}">Панель</a><a href="{{ url_for('rule_edit') }}">+ Правило</a><a href="{{ url_for('log_page') }}">Журнал</a><a href="{{ url_for('logout') }}">Выйти</a></header>{% endif %}
<main>
{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}
</main></body></html>
